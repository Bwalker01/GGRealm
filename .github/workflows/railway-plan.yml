name: Railway plan

# Plans .railway/ changes on PRs and posts the plan as a PR comment. The plan is
# pinned to the PR and applied by railway-apply.yml after merge.
# Needs the RAILWAY_TOKEN repository secret.
on:
  pull_request:
    paths:
      - ".railway/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: railwayapp/config@v1
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
