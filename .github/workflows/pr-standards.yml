name: PR standards

# Fills in the title and "Closes #<issue>" link when a PR is opened, then checks
# the branch name, title and issue link on every change.
# See .github/scripts/pr-standards.mjs for the standard.
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: pr-standards-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/pr-standards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
