name: Railway apply

# Applies the plan pinned to the merged PR when .railway/ changes land on main.
# Direct pushes to main have no pinned plan, so the apply fails by design.
# Needs the RAILWAY_TOKEN repository secret.
on:
  push:
    branches: [main]
    paths:
      - ".railway/**"

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: railwayapp/config@v1
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
